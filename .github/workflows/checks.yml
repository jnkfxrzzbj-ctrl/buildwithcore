name: CORE checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build.cjs --check
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-check.cjs
      - name: Verify isolated public package in browser
        run: |
          CORE_PUBLIC_DIR="$(node scripts/package-public.cjs)"
          CORE_SITE_ROOT="$CORE_PUBLIC_DIR" node tests/browser-check.cjs
